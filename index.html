<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js 簡易指令練習測驗系統 (Google 試算表連線版)</title>
    
    <!-- 嵌入 Google 字型: Montserrat 與 Noto Serif TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet">

    <!-- 引入 p5.js 核心程式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <style>
      /* 設定網頁全螢幕顯示，去除預設邊距與滾動條 */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #edf2fb;
        font-family: 'Noto Serif TC', 'Montserrat', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- 引入 p5.js 程式邏輯主程式 -->
    <script src="sketch.js"></script>
  </body>
</html>
